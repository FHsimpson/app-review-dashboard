<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앱 리뷰 확인판</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf1; --panel:#f8fafb; --ink:#18212b; --sub:#5b6775; --line:#d3dae1; --hover:#eef2f5;
  --accent:#0d6b6b; --accent-ink:#fff; --accent-soft:#d5ebea;
  --issue:#b8322f; --issue-soft:#f7e1e0;
  --s-todo:#8a95a3; --s-checking:#c2860c; --s-done:#2c7a4b; --s-na:#b4bcc6;
  --s-checking-soft:#fbefd6; --s-done-soft:#dcefe3;
  --tier1:#b8322f; --tier2:#c2860c; --tier3:#7c8896;
  --radius-lg:10px; --radius-sm:6px;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ee; --sub:#98a4b1; --line:#2b3540; --hover:#222b35;
  --accent:#4fb3ad; --accent-ink:#0c1a1a; --accent-soft:#193332;
  --issue:#ef7b77; --issue-soft:#3a2021;
  --s-todo:#7d8896; --s-checking:#e7b04a; --s-done:#5cc189; --s-na:#4e5966;
  --s-checking-soft:#3a3018; --s-done-soft:#183324;
}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ee; --sub:#98a4b1; --line:#2b3540; --hover:#222b35;
  --accent:#4fb3ad; --accent-ink:#0c1a1a; --accent-soft:#193332;
  --issue:#ef7b77; --issue-soft:#3a2021;
  --s-todo:#7d8896; --s-checking:#e7b04a; --s-done:#5cc189; --s-na:#4e5966;
  --s-checking-soft:#3a3018; --s-done-soft:#183324;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 64px}

/* 상단 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.top h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em}
.run{font-size:13px;color:var(--sub)}
.run.busy{color:var(--s-checking);font-weight:600}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-sm);padding:7px 12px;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:default}
.user{font-size:13px;color:var(--sub)}
.banner{background:var(--s-checking-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;margin-bottom:14px}

/* 앱 탭: 이 화면의 가장 큰 요소 */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:16px}
.tab{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-lg);padding:12px 16px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 12px}
.tab .nm{font-size:18px;font-weight:700;grid-column:1/-1}
.tab .ct{font-size:13px;color:var(--sub)}
.tab .todo{font-size:28px;font-weight:700;line-height:1;color:var(--issue);grid-row:1/3;grid-column:2;text-align:right}
.tab .todo small{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:4px}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -4px 0 var(--accent)}
.tab:not([aria-selected="true"]){opacity:.8}

/* 상태 요약 막대 */
.progress{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-bottom:18px;font-size:14px}
.bar{flex:1 1 280px;height:10px;border-radius:5px;overflow:hidden;display:flex;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--sub);font-size:13px}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

/* 2단 레이아웃 */
.grid{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.pane-title{font-size:16px;font-weight:700;margin:0 0 4px}
.pane-note{font-size:12px;color:var(--sub);margin:0 0 12px}

/* 우선 개선 항목 */
.prio{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
@media (max-width:900px){.prio{position:static;max-height:none}}
.pi{background:var(--panel);border:1px solid var(--line);border-left-width:5px;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px}
.pi.t1{border-left-color:var(--tier1)} .pi.t2{border-left-color:var(--tier2)} .pi.t3{border-left-color:var(--tier3)}
.pi.st-done{opacity:.62}
.pi-head{display:flex;align-items:baseline;gap:8px}
.tier{font-size:12px;font-weight:700}
.t1 .tier{color:var(--tier1)} .t2 .tier{color:var(--tier2)} .t3 .tier{color:var(--tier3)}
.pi-name{font-weight:600;font-size:15px;flex:1}
.pi-count{font-size:22px;font-weight:700;line-height:1}
.pi-meta{font-size:12px;color:var(--sub);margin:2px 0 6px}
.pi-fix{font-size:13px;margin:0 0 8px}
.pi-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mini{flex:1 1 90px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--s-done)}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;padding:2px 0;text-decoration:underline;text-underline-offset:2px}

/* 상태 선택 */
.st{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.st button{border:0;background:none;font-size:12px;padding:3px 10px;color:var(--sub);white-space:nowrap}
.st button+button{border-left:1px solid var(--line)}
.st button[aria-pressed="true"][data-s="todo"]{background:var(--s-todo);color:#fff}
.st button[aria-pressed="true"][data-s="checking"]{background:var(--s-checking);color:#fff}
.st button[aria-pressed="true"][data-s="done"]{background:var(--s-done);color:#fff}
.st button[aria-pressed="true"][data-s="na"]{background:var(--s-na);color:var(--ink)}
.who{font-size:12px;color:var(--sub)}

/* 필터 */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-sm);padding:6px 9px;font-size:14px}
.filters input[type=search]{flex:1 1 160px;min-width:140px}
.chk{display:flex;align-items:center;gap:5px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px}
.chip button{border:0;background:none;padding:0 4px;font-size:15px;line-height:1}

/* 리뷰 목록 */
.day{margin:18px 0 8px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.day span{font-weight:400;color:var(--sub);font-size:13px}
.rv{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--s-todo);border-radius:var(--radius-sm);padding:10px 12px 10px 14px;margin-bottom:8px}
.rv[data-state="checking"]{border-left-color:var(--s-checking)}
.rv[data-state="done"]{border-left-color:var(--s-done)}
.rv[data-state="na"]{border-left-color:var(--s-na)}
.rv[data-state="done"] .body,.rv[data-state="na"] .body{color:var(--sub)}
.rv-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--sub);margin-bottom:4px}
.store{font-weight:600;color:var(--ink)}
.stars{color:var(--s-checking);letter-spacing:1px}
.tag{border-radius:4px;padding:0 6px;background:var(--hover);color:var(--ink)}
.tag.issue{background:var(--issue-soft);color:var(--issue);font-weight:600}
.tag.new{background:var(--accent);color:var(--accent-ink);font-weight:700}
.rv h3{font-size:14px;margin:0 0 2px;font-weight:600}
.body{font-size:14px;margin:0;white-space:pre-wrap;word-break:break-word;max-width:80ch}
.rv-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:8px}
details.memo summary{cursor:pointer;font-size:12px;color:var(--accent);list-style:none}
details.memo summary::-webkit-details-marker{display:none}
details.memo[open]{flex-basis:100%}
.memo-row{display:flex;gap:6px;margin-top:6px}
.memo-row textarea{flex:1;min-height:52px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);padding:6px 8px;font-size:13px;resize:vertical}
.memo-text{font-size:13px;background:var(--hover);border-radius:var(--radius-sm);padding:5px 8px;margin-top:6px;white-space:pre-wrap}
.empty{text-align:center;color:var(--sub);padding:40px 0}

/* 로그인·설정·알림 */
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20;padding:20px}
.gate .box{max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;text-align:center}
.gate h2{margin:0 0 8px;font-size:20px}
.gate p{color:var(--sub);font-size:14px;margin:0 0 18px}
dialog{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--panel);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(10,15,20,.45)}
dialog h2{margin:0 0 14px;font-size:18px}
dialog h3{margin:18px 0 6px;font-size:15px}
dialog p{font-size:13px;color:var(--sub);margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.row input[type=email],.row input[type=password]{flex:1;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);padding:7px 9px;font-size:14px}
.members{list-style:none;margin:0 0 8px;padding:0;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
.members li{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:14px;border-top:1px solid var(--line)}
.members li:first-child{border-top:0}
.members li span{flex:1;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius-sm);font-size:14px;max-width:calc(100% - 32px);z-index:30;display:none}
.toast.show{display:block}
@media (prefers-reduced-motion:no-preference){.toast.show{animation:rise .18s ease-out}@keyframes rise{from{transform:translate(-50%,8px);opacity:0}}}
</style>
<script src="config.js"></script>
<script src="demo-data.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>앱 리뷰 확인판</h1>
    <span class="run" id="runInfo"></span>
    <div class="right">
      <button class="btn primary" id="btnRefresh">리뷰 최신화</button>
      <span class="user" id="userBox"></span>
      <button class="btn" id="btnSettings" hidden>설정</button>
      <button class="btn" id="btnLogout" hidden>로그아웃</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="앱 선택"></nav>
  <section class="progress" id="progress" aria-label="확인 진행 상황"></section>
  <main class="grid">
    <aside class="prio" id="prio" aria-label="우선 개선 항목"></aside>
    <section>
      <h2 class="pane-title">리뷰</h2>
      <div class="filters">
        <select id="fStore" aria-label="스토어"><option value="">전체 스토어</option><option value="play">Google Play</option><option value="ios">App Store</option></select>
        <select id="fState" aria-label="확인 상태"><option value="">전체 상태</option><option value="todo">미확인</option><option value="checking">확인중</option><option value="done">확인완료</option><option value="na">해당없음</option></select>
        <label class="chk"><input type="checkbox" id="fIssue"> 이슈만</label>
        <input type="search" id="fQ" placeholder="내용 검색" aria-label="내용 검색">
        <span id="fIssueChip"></span>
      </div>
      <div id="list"></div>
    </section>
  </main>
</div>

<div class="gate" id="gate" hidden>
  <div class="box">
    <h2 id="gateTitle">팀 계정으로 로그인</h2>
    <p id="gateMsg">등록된 Google 계정으로 로그인하면 팀원과 같은 확인 현황을 봅니다.</p>
    <button class="btn primary" id="btnLogin">Google 계정으로 로그인</button>
  </div>
</div>

<dialog id="dlg">
  <h2>설정</h2>
  <h3>팀원</h3>
  <p>여기 등록된 Google 계정만 이 페이지를 볼 수 있습니다.</p>
  <ul class="members" id="memberList"></ul>
  <div class="row">
    <input type="email" id="newMember" placeholder="teammate@company.com" aria-label="추가할 이메일">
    <label class="chk"><input type="checkbox" id="newAdmin"> 관리자</label>
    <button class="btn" id="btnAddMember">추가</button>
  </div>
  <h3>리뷰 최신화 연결</h3>
  <p id="tokenState"></p>
  <div class="row">
    <input type="password" id="ghToken" placeholder="GitHub 토큰 붙여넣기" autocomplete="off" aria-label="GitHub 토큰">
    <button class="btn" id="btnSaveToken">저장</button>
  </div>
  <p>토큰 권한은 이 저장소의 Actions 읽기/쓰기만 주세요. 팀원 브라우저에서 수집 실행에만 쓰입니다.</p>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="btnClose">닫기</button></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =========================================================== 설정 */
const CFG = window.APP_CONFIG || {};
const DEMO = !(CFG.firebase && CFG.firebase.apiKey);
const FB_VER = "10.12.2";
const APPS = [{ key: "nf", name: "노스페이스 코리아" }, { key: "sk", name: "스케쳐스 코리아" }];
const STORE_NAME = { play: "Google Play", ios: "App Store" };
const STATES = [["todo", "미확인"], ["checking", "확인중"], ["done", "확인완료"], ["na", "해당없음"]];
const STATE_LABEL = Object.fromEntries(STATES);

/* =========================================================== 분류 규칙 (수정 가능) */
const NEGATIVE = ["안됨","안되","안 되","오류","에러","불편","쓰레기","최악","짜증","튕","버그","느림","느려","못","불가","실망","문제","구려","안열","안 열","없음","무한","할수가","안뜸","아무것도","잘려","잘림","렉","먹통","터지","풀려","풀림","로그아웃"];
const NEG_NEGATION = /(버벅임|버벅|오류|에러|문제|렉|불편)(이|은|도|가)?\s?(전혀\s?)?(없|안\s?느)/g;
// [이름, 심각도(3 치명/2 중요/1 보통), 정규식, 대응 제안]
const ISSUES = [
  ["로그인 실패/오류", 3, /로그인.{0,14}(안\s?[되돼됨]|못|불가|오류|무한|먹통|외부|안\s?들어|버벅)|(안|못).{0,6}로그인|로그인을?\s?할\s?수가|로그인이\s?안|로그인조차/i, "로그인 진입 동선(외부 사이트 이동), 앱/웹 계정 불일치, 오류 로그 재현 및 수정"],
  ["로그인 유지 안 됨", 2, /자동\s?로그인|로그인\s?상태|매번\s?로그인|로그인.{0,6}풀|풀려|풀림|로그아웃|다시\s?로그인/i, "자동로그인 토큰 만료·갱신 정책, 앱 재실행·외부 앱 복귀 시 세션 유지"],
  ["소셜/간편 로그인 연동", 3, /카카오.{0,6}(로그인|계정|연동)|카톡.{0,6}(로그인|연동)|PASS|패스\s?인증|pass도/i, "카카오/PASS 로그인과 기존 계정 연결 플로우 점검 (웹은 되는데 앱만 실패 등)"],
  ["회원가입/인증/아이디 찾기", 3, /회원가입|가입\s?(절차|이?\s?안|이?\s?어렵)|가입.{0,4}(어렵|안\s?[되돼])|인증|아이디\s?찾기|개인정보수집동의|동의\s?화면|ID가|아이디가|토큰\s?아이디/i, "가입·본인인증·약관 동의 화면 이탈/반복, 아이디 찾기 결과 표시 점검"],
  ["결제/구매 진행 불가", 3, /결제|결재|구매하기|바로\s?구매|구매가?\s?안|구매.{0,6}(안|못)|주문.{0,6}(안|못)|모니모|삼성카드|장바구니/i, "구매 버튼 무반응, 결제 완료 처리, 카드사 앱 연동(모니모 등), 결제창 잘림 점검"],
  ["속도 저하/로딩/버벅임", 2, /느림|느려|느린|로딩|버벅|오래\s?걸|렉|개느|구동이\s?안|최적화/i, "앱 실행·화면 전환·이미지 로딩 시간 측정, 서버 응답·트래픽 집중 대응"],
  ["서버 장애/접속 폭주", 3, /서버|터지|터져|접속.{0,4}안|사람\s?몰/i, "재입고·행사 시 트래픽 대응(대기열, 증설), 장애 시 안내 화면"],
  ["앱 오류/먹통/충돌", 3, /먹통|충돌|튕|오류|에러|안\s?열|작동이\s?안|실행.{0,6}안|멈추|멈춤/i, "크래시·ANR 로그, 특정 기기·OS 재현, 오류 화면의 복구 동선 확인"],

  ["쿠폰/혜택 미지급·오류", 2, /쿠폰|적립|마일리지/i, "앱 설치·가입 쿠폰 지급 로직, 쿠폰 오류 안내, 적립·마일리지 정책 문구 점검"],
  ["기기 호환/태블릿 대응", 2, /설치할\s?수?\s?없|설치.{0,4}안|아이패드|패드|태블릿|갤럭시/i, "지원 기기·OS 범위(갤럭시 S25 등) 확인, iPad·태블릿 레이아웃 대응"],
  ["알림/푸시 동의", 2, /푸시|푸쉬|알림/i, "푸시 동의 팝업 반복, 재입고 알림 미수신 점검"],
  ["데이터 과다 사용", 2, /데이터.{0,8}(잡아|날라|증발|과다|너무)|GB/i, "이미지·영상 캐시 정책, 백그라운드 트래픽 측정"],
  ["개인정보·설정 저장 안 됨", 2, /수신동의|개인정보\s?변경|변경되었다고/i, "마케팅 수신동의·개인정보 변경 저장과 재진입 시 반영 여부 점검"],
  ["고객응대(CS) 지연", 1, /1:1|고객센터|답변|통화량/i, "1:1 문의 답변 기준 시간, 유선 문의 콜백 프로세스 점검"],
];

function classify(r) {
  const text = ((r.title || "") + " " + (r.text || "")).replace(NEG_NEGATION, "");
  const kw = NEGATIVE.some(k => text.includes(k));
  const neg = r.rating == null ? kw : r.rating <= 2 || (r.rating === 3 && kw);
  const issues = neg ? ISSUES.filter(i => i[2].test(text)).map(i => i[0]) : [];
  return { neg, issues };
}

/* =========================================================== 공용 */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toDate = v => (v && v.toDate) ? v.toDate() : (v ? new Date(v) : null);
const fmt = d => d ? `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` : "";
const issueKey = (app, name) => `${app}__${name.replace(/[\/]/g, "_")}`;
let toastTimer;
function toast(msg, ms = 3500) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

/* =========================================================== 저장소: Firebase */
async function firebaseStore() {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`),
  ]);
  const app = initializeApp(CFG.firebase);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  let unsubs = [];

  $("btnLogin").onclick = async () => {
    try { await A.signInWithPopup(auth, new A.GoogleAuthProvider()); }
    catch (e) { toast("로그인하지 못했습니다: " + (e.code || e.message)); }
  };
  $("btnLogout").onclick = () => A.signOut(auth);

  const denied = () => {
    showGate("접근 권한이 없습니다", `${S.user.email} 계정이 팀원으로 등록되어 있지 않습니다. 관리자에게 이 이메일을 추가해 달라고 요청하세요.`, true);
  };

  A.onAuthStateChanged(auth, user => {
    unsubs.forEach(u => u()); unsubs = [];
    if (!user) { S.user = null; showGate("팀 계정으로 로그인", "등록된 Google 계정으로 로그인하면 팀원과 같은 확인 현황을 봅니다."); renderHeader(); return; }
    S.user = { email: (user.email || "").toLowerCase(), name: user.displayName || user.email };
    $("gate").hidden = true;
    renderHeader();
    const onErr = e => { if (e.code === "permission-denied") denied(); else toast("데이터를 불러오지 못했습니다: " + e.code); };
    unsubs.push(F.onSnapshot(F.doc(db, "config", "members"), s => { S.members = s.data() || { emails: [], admins: [] }; renderHeader(); renderSettings(); }, onErr));
    unsubs.push(F.onSnapshot(F.collection(db, "reviews"), s => {
      S.reviews = s.docs.map(d => { const r = { id: d.id, ...d.data() }; return { ...r, ...classify(r) }; });
      renderAll();
    }, onErr));
    unsubs.push(F.onSnapshot(F.collection(db, "status"), s => { S.status = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); renderAll(); }, onErr));
    unsubs.push(F.onSnapshot(F.collection(db, "issueStatus"), s => { S.issueStatus = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); renderAll(); }, onErr));
    unsubs.push(F.onSnapshot(F.doc(db, "meta", "lastRun"), s => { onMeta(s.data() || null); }, () => {}));
    unsubs.push(F.onSnapshot(F.doc(db, "config", "github"), s => { S.github = s.data() || null; renderSettings(); }, () => {}));
  });

  return {
    async setStatus(kind, id, patch) {
      const col = kind === "issue" ? "issueStatus" : "status";
      const cur = (kind === "issue" ? S.issueStatus : S.status)[id] || {};
      const data = { state: cur.state || "todo", memo: cur.memo || "", ...patch, by: S.user.email, byName: S.user.name, at: F.serverTimestamp() };
      try { await F.setDoc(F.doc(db, col, id), data); }
      catch (e) { toast("저장하지 못했습니다: " + e.code); }
    },
    async refresh() {
      const g = CFG.github || {};
      if (!g.owner || !g.repo) return toast("config.js 에 GitHub 저장소 정보가 비어 있습니다.");
      const m = S.meta;
      if (m && m.status === "running" && Date.now() - new Date(m.startedAt).getTime() < 15 * 60e3) return toast("이미 수집 중입니다. 끝나면 목록이 자동으로 갱신됩니다.");
      let token = S.github && S.github.token;
      if (!token) { const d = await F.getDoc(F.doc(db, "config", "github")); token = d.exists() && d.data().token; }
      if (!token) return toast("관리자가 설정에서 GitHub 토큰을 등록해야 합니다.");
      $("btnRefresh").disabled = true;
      try {
        const res = await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/actions/workflows/${g.workflow || "collect.yml"}/dispatches`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" },
          body: JSON.stringify({ ref: g.branch || "main", inputs: { trigger: S.user.email } }),
        });
        if (res.status === 204) {
          S.refreshAt = Date.now();
          setRunInfo("수집 요청됨. 1~3분 뒤 새 리뷰가 자동으로 표시됩니다.", true);
          toast("수집을 시작했습니다. 이 화면을 열어 두면 새 리뷰가 자동으로 추가됩니다.", 5000);
          setTimeout(() => { if (S.refreshAt) { S.refreshAt = 0; $("btnRefresh").disabled = false; renderRun(); } }, 10 * 60e3);
          return;
        }
        const why = { 401: "토큰이 만료되었거나 잘못되었습니다.", 403: "토큰에 Actions 쓰기 권한이 없습니다.", 404: "저장소나 워크플로 이름을 찾지 못했습니다.", 422: "브랜치 이름이 맞지 않습니다." }[res.status] || `오류 ${res.status}`;
        toast("수집을 시작하지 못했습니다. " + why + " 관리자에게 알려 주세요.", 6000);
      } catch (e) { toast("GitHub 에 연결하지 못했습니다: " + e.message); }
      $("btnRefresh").disabled = false;
    },
    async saveMembers(next) {
      try { await F.setDoc(F.doc(db, "config", "members"), next); }
      catch (e) { toast("저장하지 못했습니다: " + e.code); }
    },
    async saveToken(token) {
      try { await F.setDoc(F.doc(db, "config", "github"), { token, by: S.user.email, at: F.serverTimestamp() }); toast("토큰을 저장했습니다."); }
      catch (e) { toast("저장하지 못했습니다: " + e.code); }
    },
  };
}

/* =========================================================== 수집 상태 */
function onMeta(m) {
  const prev = S.meta; S.meta = m;
  if (S.refreshAt && m && m.status !== "running" && m.finishedAt && new Date(m.finishedAt).getTime() > S.refreshAt - 60e3) {
    S.refreshAt = 0; $("btnRefresh").disabled = false;
    if (m.status === "error") toast("수집 중 오류가 났습니다. 관리자에게 GitHub Actions 기록 확인을 요청하세요.", 6000);
    else toast(m.added ? `새 리뷰 ${m.added}건을 가져왔습니다.` : "새로 올라온 리뷰가 없습니다.", 5000);
  } else if (prev && prev.status === "running" && m && m.status === "done" && m.added) {
    toast(`새 리뷰 ${m.added}건이 추가되었습니다.`);
  }
  renderRun();
}
function setRunInfo(text, busy) { const el = $("runInfo"); el.textContent = text; el.classList.toggle("busy", !!busy); }
function renderRun() {
  if (DEMO) return setRunInfo("데모 모드: 확인 상태가 이 브라우저에만 저장됩니다.");
  const m = S.meta;
  if (S.refreshAt) return setRunInfo("수집 중… 새 리뷰가 자동으로 표시됩니다.", true);
  if (!m) return setRunInfo("아직 수집 기록이 없습니다.");
  if (m.status === "running") return setRunInfo("수집 중…", true);
  const t = fmt(toDate(m.finishedAt));
  const failed = (m.failed || []).length ? ` (일부 스토어 조회 실패)` : "";
  setRunInfo(m.status === "error" ? `마지막 수집 ${t} 오류` : `마지막 수집 ${t}, 새 리뷰 ${m.added || 0}건${failed}`);
}

/* =========================================================== 계산 */
const stateOf = id => (S.status[id] && S.status[id].state) || "todo";
const appRows = () => S.reviews.filter(r => r.app === S.app);
const latestNewDate = () => {
  const d = S.reviews.filter(r => !r.seed).map(r => r.collectedAt).sort();
  return d.length ? d[d.length - 1] : null;
};
function priorityItems(app) {
  const now = Date.now();
  const rows = S.reviews.filter(r => r.app === app && r.neg);
  return ISSUES.map(([name, sev, , fix]) => {
    const hit = rows.filter(r => r.issues.includes(name)).sort((a, b) => b.date.localeCompare(a.date));
    if (!hit.length) return null;
    const recent = hit.filter(r => (now - new Date(r.date)) / 864e5 <= 180).length;
    const total = hit.length;
    // 긴급: 최근 6개월 3건 이상, 또는 치명 유형이 최근 2건 이상 / 높음: 최근 언급이 있거나 누적 5건 이상
    let tier = 3;
    if (recent >= 3 || (sev >= 3 && recent >= 2)) tier = 1;
    else if (recent >= 1 || total >= 5) tier = 2;
    const checked = hit.filter(r => ["done", "na"].includes(stateOf(r.id))).length;
    const key = issueKey(app, name);
    const st = S.issueStatus[key] || {};
    return { name, sev, fix, hit, total, recent, tier, checked, key, st, score: sev * 2 + total + recent * 2 };
  }).filter(Boolean).sort((a, b) => {
    const da = (a.st.state === "done" || a.st.state === "na") ? 1 : 0, dbb = (b.st.state === "done" || b.st.state === "na") ? 1 : 0;
    return da - dbb || a.tier - b.tier || b.score - a.score;
  });
}

/* =========================================================== 렌더 */
function stControl(kind, id, cur) {
  return `<div class="st" role="group" aria-label="확인 상태" data-kind="${kind}" data-id="${esc(id)}">${STATES.map(([v, l]) =>
    `<button type="button" data-s="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div>`;
}
function whoLine(st) {
  if (!st || !st.by || (!st.state || st.state === "todo") && !st.memo) return "";
  return `<span class="who">${esc(st.byName || st.by)}, ${esc(fmt(toDate(st.at)))}</span>`;
}
function memoBlock(kind, id, st) {
  const memo = (st && st.memo) || "";
  return `<details class="memo"><summary>${memo ? "메모 수정" : "메모 추가"}</summary>
    <div class="memo-row"><textarea data-kind="${kind}" data-id="${esc(id)}" maxlength="1000" placeholder="재현 결과, 담당자, 티켓 번호 등">${esc(memo)}</textarea>
    <button type="button" class="btn" data-save-memo>저장</button></div></details>
    ${memo ? `<div class="memo-text">${esc(memo)}</div>` : ""}`;
}

function renderHeader() {
  const u = S.user;
  $("userBox").textContent = u ? u.email : "";

  }

function renderTabs() {
  $("tabs").innerHTML = APPS.map(a => {
    const rows = S.reviews.filter(r => r.app === a.key);

  }).join("");
}

function renderProgress() {
  const issues = appRows().filter(r => r.neg);
  const n = issues.length || 1;
  const c = Object.fromEntries(STATES.map(([v]) => [v, issues.filter(r => stateOf(r.id) === v).length]));
  const color = { todo: "var(--s-todo)", checking: "var(--s-checking)", done: "var(--s-done)", na: "var(--s-na)" };
  const rated = appRows().filter(r => r.rating != null);
  const avg = rated.length ? (rated.reduce((s, r) => s + r.rating, 0) / rated.length).toFixed(1) : "-";
  $("progress").innerHTML = `<strong>이슈 리뷰 확인 현황</strong>
    <div class="bar" aria-hidden="true">${STATES.map(([v]) => `<i style="width:${c[v] / n * 100}%;background:${color[v]}"></i>`).join("")}</div>
    <div class="legend">${STATES.map(([v, l]) => `<span><span class="dot" style="background:${color[v]}"></span>${l} <b>${c[v]}</b></span>`).join("")}
    <span>평균 별점 <b>${avg}</b></span></div>`;
}

function renderPriority() {
  const items = priorityItems(S.app);
  const body = items.length ? items.map(x => {
    const state = x.st.state || "todo";
    return `<article class="pi t${x.tier} st-${state}">
      <div class="pi-head"><span class="tier">${["", "긴급", "높음", "보통"][x.tier]}</span>
        <span class="pi-name">${esc(x.name)}</span><span class="pi-count">${x.total}</span></div>
      <div class="pi-meta">최근 6개월 ${x.recent}건, 마지막 언급 ${esc(x.hit[0].date)}</div>
      <p class="pi-fix">${esc(x.fix)}</p>
      <div class="pi-foot">
        ${stControl("issue", x.key, state)}
        <div class="mini" title="관련 리뷰 확인 ${x.checked}/${x.total}"><i style="width:${x.checked / x.total * 100}%"></i></div>
        <span class="who">리뷰 확인 ${x.checked}/${x.total}</span>
        <button type="button" class="linkbtn" data-issue="${esc(x.name)}">관련 리뷰 보기</button>
      </div>
      <div class="pi-foot" style="margin-top:6px">${whoLine(x.st)}</div>
      ${memoBlock("issue", x.key, x.st)}
    </article>`;
  }).join("") : '<p class="pane-note">이슈로 분류된 리뷰가 없습니다.</p>';
  $("prio").innerHTML = `<h2 class="pane-title">우선 개선 항목</h2>
    <p class="pane-note">이슈 리뷰를 유형별로 묶었습니다. 긴급은 최근 6개월 언급이 3건 이상이거나, 로그인·결제·장애 같은 치명 유형이 최근 2건 이상인 항목입니다. 확인완료·해당없음 항목은 아래로 내려갑니다.</p>${body}`;
}

function renderList() {
  const f = S.f, q = f.q.trim().toLowerCase(), newest = latestNewDate();
  const list = appRows().filter(r =>
    (!f.store || r.store === f.store) && (!f.state || stateOf(r.id) === f.state) &&
    (!f.issueOnly || r.neg) && (!f.issue || r.issues.includes(f.issue)) &&
    (!q || ((r.title || "") + " " + r.text).toLowerCase().includes(q))
  ).sort((a, b) => b.date.localeCompare(a.date) || (a.store > b.store ? 1 : -1));
  $("fIssueChip").innerHTML = f.issue ? `<span class="chip">${esc(f.issue)}<button type="button" data-clear-issue aria-label="유형 필터 해제">×</button></span>` : "";
  if (!list.length) { $("list").innerHTML = '<div class="empty">조건에 맞는 리뷰가 없습니다. 필터를 풀어 보세요.</div>'; return; }
  let html = "", day = "";
  const perDay = {};
  list.forEach(r => perDay[r.date] = (perDay[r.date] || 0) + 1);
  for (const r of list) {
    if (r.date !== day) { day = r.date; html += `<h3 class="day">${esc(day)}<span>${perDay[day]}건</span></h3>`; }
    const st = S.status[r.id], state = stateOf(r.id);
    const stars = r.rating != null ? `<span class="stars" aria-label="별점 ${r.rating}점">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span>` : "";
    html += `<article class="rv" data-state="${state}">
      <div class="rv-top">
        ${!r.seed && r.collectedAt === newest ? '<span class="tag new">NEW</span>' : ""}
        <span class="store">${STORE_NAME[r.store] || esc(r.store)}</span>${stars}
        ${r.neg ? '<span class="tag issue">이슈</span>' : ""}
        ${r.issues.map(i => `<span class="tag">${esc(i)}</span>`).join("")}
        ${r.version ? `<span>v${esc(r.version)}</span>` : ""}
      </div>
      ${r.title ? `<h3>${esc(r.title)}</h3>` : ""}
      <p class="body">${esc(r.text)}</p>
      <div class="rv-foot">${stControl("review", r.id, state)}${whoLine(st)}${memoBlock("review", r.id, st)}</div>
    </article>`;
  }
  $("list").innerHTML = html;
}

function renderAll() {
  if (!APPS.some(a => a.key === S.app)) S.app = "nf";
  renderTabs(); renderProgress(); renderPriority(); renderList(); renderRun();
}

function showGate(title, msg, hideLogin) {
  $("gate").hidden = false; $("gateTitle").textContent = title; $("gateMsg").textContent = msg;
  $("btnLogin").textContent = hideLogin ? "다른 계정으로 로그인" : "Google 계정으로 로그인";
}

/* =========================================================== 설정 창 */
function renderSettings() {
  if (DEMO || !$("dlg").open) return;
  const m = S.members || { emails: [], admins: [] };
  const admins = m.admins || [];
  $("memberList").innerHTML = (m.emails || []).map(e => `<li><span>${esc(e)}</span>
    ${admins.includes(e) ? '<span class="tag">관리자</span>' : ""}
    ${e === S.user.email ? "" : `<button type="button" class="btn" data-remove="${esc(e)}">삭제</button>`}</li>`).join("");
  const g = S.github;
  $("tokenState").textContent = g && g.token ? `등록됨 (${g.by || ""}, ${fmt(toDate(g.at))}). 바꾸려면 새 토큰을 붙여넣고 저장하세요.` : "아직 등록되지 않았습니다. 등록 전에는 [리뷰 최신화]가 동작하지 않습니다.";
}

/* =========================================================== 이벤트 */
let store;
document.addEventListener("click", async e => {
  const tab = e.target.closest(".tab");
  if (tab) {
    S.app = tab.dataset.app; S.f = { store: "", state: "", issueOnly: false, q: "", issue: "" };
    $("fStore").value = ""; $("fState").value = ""; $("fIssue").checked = false; $("fQ").value = "";
    try { localStorage.setItem("tab", S.app); } catch (_) {}
    renderAll(); return;
  }
  const sb = e.target.closest(".st button");
  if (sb) {
    const g = sb.parentElement;
    await store.setStatus(g.dataset.kind, g.dataset.id, { state: sb.dataset.s });
    return;
  }
  if (e.target.matches("[data-save-memo]")) {
    const ta = e.target.parentElement.querySelector("textarea");
    await store.setStatus(ta.dataset.kind, ta.dataset.id, { memo: ta.value.trim() });
    toast("메모를 저장했습니다."); return;
  }
  const ib = e.target.closest("[data-issue]");
  if (ib) {
    S.f.issue = ib.dataset.issue; S.f.issueOnly = true; $("fIssue").checked = true;
    renderList();
    document.querySelector(".filters").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    return;
  }
  if (e.target.matches("[data-clear-issue]")) { S.f.issue = ""; renderList(); return; }
  const rm = e.target.closest("[data-remove]");
  if (rm) {
    const m = S.members, email = rm.dataset.remove;
    if (!confirm(`${email} 계정을 팀원에서 삭제할까요?`)) return;
    await store.saveMembers({ emails: m.emails.filter(x => x !== email), admins: (m.admins || []).filter(x => x !== email) });
  }
});
$("fStore").onchange = e => { S.f.store = e.target.value; renderList(); };
$("fState").onchange = e => { S.f.state = e.target.value; renderList(); };
$("fIssue").onchange = e => { S.f.issueOnly = e.target.checked; if (!e.target.checked) S.f.issue = ""; renderList(); };
$("fQ").oninput = e => { S.f.q = e.target.value; renderList(); };
$("btnRefresh").onclick = () => store.refresh();
$("btnSettings").onclick = () => { $("dlg").showModal(); renderSettings(); };
$("btnClose").onclick = () => $("dlg").close();
$("btnAddMember").onclick = async () => {
  const email = $("newMember").value.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("이메일 형식을 확인하세요.");
  const m = S.members || { emails: [], admins: [] };
  const emails = [...new Set([...(m.emails || []), email])];
  const admins = $("newAdmin").checked ? [...new Set([...(m.admins || []), email])] : (m.admins || []);
  await store.saveMembers({ emails, admins });
  $("newMember").value = ""; $("newAdmin").checked = false; toast(`${email} 계정을 추가했습니다.`);
};
$("btnSaveToken").onclick = async () => {
  const t = $("ghToken").value.trim();
  if (!/^(github_pat_|ghp_)/.test(t)) return toast("GitHub 토큰 형식이 아닙니다. github_pat_ 로 시작하는 값을 붙여넣으세요.");
  await store.saveToken(t); $("ghToken").value = "";
};

/* =========================================================== 시작 */
(async () => {
  if (DEMO) { store = demoStore(); renderHeader(); renderAll(); return; }
  try { store = await firebaseStore(); renderAll(); }
  catch (e) { $("banner").hidden = false; $("banner").textContent = "Firebase 를 불러오지 못했습니다. config.js 값을 확인하세요. (" + e.message + ")"; }
})();
</script>
</body>
</html>
