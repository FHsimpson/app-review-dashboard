name: 리뷰 수집

on:
  schedule:
    - cron: "5 0 * * 1-5"      # 평일 09:05 KST (UTC 00:05). GitHub 사정으로 몇 분~수십 분 늦을 수 있음
  workflow_dispatch:            # 대시보드의 [리뷰 최신화] 버튼 또는 Actions 탭에서 수동 실행
    inputs:
      trigger:
        description: "실행한 사람/경로"
        required: false
        default: "manual"

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write              # 아래 keepalive 커밋용

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: 리뷰 수집 → Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger }}
        run: python collector/collect.py
      - name: 공개 저장소 60일 비활성 시 예약 실행이 꺼지는 것 방지
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt 3888000 ]; then
            git config user.name "review-bot"
            git config user.email "review-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 예약 수집 유지"
            git push
          fi
